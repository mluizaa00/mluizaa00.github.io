name: Atualizar grade de contribuições

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar grade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_contributions.py
      - name: Commit se mudou
        run: |
          if git diff --quiet; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: atualiza grade de contribuições"
          git push
