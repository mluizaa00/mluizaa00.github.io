<html lang="pt-BR">
<head>

<title>fiches de français — luiza prestes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<meta name="robots" content="noindex">

<style>
/* VOICE: o mesmo do site da Luiza: neo-brutalista, divertido, direto
   IDEA: pilha de fichas de estudo com borda grossa e sombra dura, como os cards do portfólio
   PICTURE: a ficha grande no centro, gira para mostrar a resposta
   COLOUR/TYPE: creme #F6F0E4, tinta #16120F, coral #FF5C5C, rosa #FFE5E3; Bricolage 800 + Space Grotesk + JetBrains Mono
   LAYOUT: início = lista de capítulos; estudo = ficha e dois botões grandes na altura do polegar */
:root{--bg:#F6F0E4;--ink:#16120F;--coral:#FF5C5C;--pink:#FFE5E3;--white:#FFFFFF;--mut:#5a524b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 'Space Grotesk',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;
background-image:linear-gradient(rgba(22,18,15,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(22,18,15,.08) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.mono{font-family:'JetBrains Mono',monospace}
.nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2.5px solid var(--ink)}
.nav div{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);background:var(--white);border:2.5px solid var(--ink);border-radius:999px;padding:9px 16px;box-shadow:4px 4px 0 var(--ink)}
.tag{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;background:var(--pink);border:2px dashed var(--ink);border-radius:999px;padding:5px 12px;transform:rotate(-3deg);display:inline-block}
.top{max-width:1040px;margin:0 auto;padding:40px 20px 8px}
.top h1{font:800 clamp(44px,9vw,76px)/.95 'Bricolage Grotesque','Space Grotesk',sans-serif;letter-spacing:-.03em;margin:0}
.top h1 span{background:var(--coral);border:2.5px solid var(--ink);border-radius:16px;padding:0 10px;box-shadow:5px 5px 0 var(--ink);display:inline-block;transform:rotate(-1.5deg)}
.top p{margin:18px 0 0;font-size:18px;max-width:560px}
.bar{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--white);margin-top:16px;overflow:hidden;max-width:520px}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .4s;border-right:2.5px solid var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 64px}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.btn{min-height:48px;padding:12px 22px;border-radius:999px;border:2.5px solid var(--ink);background:var(--white);font-weight:700;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.pri{background:var(--coral)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;list-style:none;margin:0;padding:0}
.ch{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;width:100%;height:100%;text-align:left;padding:16px 18px;border-radius:22px;border:2.5px solid var(--ink);background:var(--white);box-shadow:6px 6px 0 var(--ink);transition:transform .2s,box-shadow .2s}
.ch:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:9px 9px 0 var(--ink)}
.ch .n{font:800 26px/1 'Bricolage Grotesque',sans-serif;background:var(--pink);border:2px solid var(--ink);border-radius:14px;height:52px;display:grid;place-items:center}
.ch.full .n{background:var(--coral)}
.ch b{display:block;font:800 19px/1.1 'Bricolage Grotesque',sans-serif}
.ch small{color:var(--mut);font-size:14px;display:block;margin-top:4px}
.ch .pc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-top:10px}
.mini{flex:1;height:8px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);overflow:hidden}
.mini i{display:block;height:100%;background:var(--coral)}
.hide{display:none!important}
/* estudo */
.sHead{display:flex;align-items:center;gap:12px;margin-bottom:16px;max-width:620px;margin-inline:auto}
.sHead .t{flex:1}
.sHead b{display:block;font:800 22px/1.05 'Bricolage Grotesque',sans-serif}
.sHead small{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.back{width:48px;height:48px;border-radius:999px;border:2.5px solid var(--ink);background:var(--white);display:grid;place-items:center;flex:none;box-shadow:4px 4px 0 var(--ink)}
.sHead .btn{min-height:44px;padding:8px 16px;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.prog{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden;margin:0 auto 22px;max-width:620px}
.prog i{display:block;height:100%;background:var(--coral);width:0;transition:width .3s}
.scene{perspective:1400px;margin:0 auto;max-width:620px}
.card{position:relative;width:100%;min-height:min(56vh,420px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer;border:0;padding:0;background:none;display:block}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:2.5px solid var(--ink);background:var(--white);box-shadow:10px 10px 0 var(--ink);
display:flex;flex-direction:column;text-align:left;overflow:hidden}
.face.b{transform:rotateY(180deg);background:var(--white)}
.chrome{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2.5px solid var(--ink);flex:none}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:999px;border:2px solid var(--ink);background:var(--white)}
.dots i:first-child{background:var(--coral)}.dots i:nth-child(2){background:var(--pink)}
.kind{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.body{padding:20px 22px;display:flex;flex-direction:column;flex:1;overflow:auto;position:relative}
.face.f .body{background:var(--pink)}
.txt{font:800 clamp(28px,7vw,40px)/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:auto 0;padding:10px 0;overflow-wrap:anywhere}
.face.b .txt{font-size:clamp(24px,6vw,34px);margin:12px 0 0;padding:0}
.q{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--mut);overflow-wrap:anywhere;padding-right:52px}
.note{margin-top:auto;align-self:flex-start;font-size:15px;background:var(--pink);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;margin-top:18px;overflow-wrap:anywhere;transform:rotate(-1deg)}
.note:empty{display:none}
.note::before{content:"dica: ";font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px}
.tap{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;text-align:center}
.spk{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:999px;border:2.5px solid var(--ink);background:var(--coral);display:grid;place-items:center;color:var(--ink);box-shadow:3px 3px 0 var(--ink);z-index:2}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:620px;margin:26px auto 0}
.tool{min-height:44px;padding:8px 16px;border-radius:999px;border:2.5px solid var(--ink);background:var(--white);font-weight:700;font-size:15px;box-shadow:4px 4px 0 var(--ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.tool svg{flex:none}
.voice{flex:1 1 180px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.voice select{flex:1;min-height:44px;font:500 15px 'Space Grotesk',sans-serif;border:2.5px solid var(--ink);border-radius:14px;background:var(--white);color:var(--ink);padding:6px 10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:620px;margin:22px auto 0}
.ans .btn{min-height:58px;font-size:18px}
.yes{background:var(--coral)!important}
.hint{text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;margin-top:14px}
.done{text-align:center;padding:24px 10px;max-width:620px;margin:0 auto}
.done h2{font:800 clamp(40px,8vw,60px)/.95 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:0 0 14px}
.done .acts{justify-content:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){.card,.btn,.ch,.bar i,.prog i{transition:none}}
</style>
</head>
<body>
<header class="nav"><div>
  <a class="pill" href="/">luiza prestes</a>
  <span class="tag">a1 → b1</span>
</div></header>
<section class="top" id="hero">
  <h1>fiches de <span>français</span></h1>
  <p id="sub">Flashcards por capítulo. Toque na ficha para virar.</p>
  <div class="bar"><i id="gbar"></i></div>
</section>

<main class="wrap">
  <section id="home">
    <div class="acts">
      <button class="btn pri" id="bMix">Misturar tudo</button>
      <button class="btn" id="bWrong">Revisar as que errei</button>
      <button class="btn" id="bReset">Zerar progresso</button>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section id="study" class="hide">
    <div class="sHead">
      <button class="back" id="bBack" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="t"><b id="sTitle"></b><small id="sCount"></small></div>
      <button class="btn" id="bShuf">Embaralhar</button>
    </div>
    <div class="prog"><i id="sProg"></i></div>
    <div id="deck">
      <div class="scene">
        <button class="card" id="card" aria-label="Virar cartão">
          <div class="face f"><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="kind" id="kF"></span></div><div class="body"><div class="txt" id="tF"></div><div class="tap">toque para ver a resposta</div></div></div>
          <div class="face b"><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="kind" id="kB"></span></div><div class="body"><div class="q" id="qB"></div><div class="txt" id="tB"></div><div class="note" id="nB"></div></div></div>
        </button>
      </div>
      <div class="tools">
        <button class="tool" id="bSpeak" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>ouvir</button>
        <a class="tool" id="aRev" href="https://dicionario.reverso.net/frances-portugues/" target="_blank" rel="noopener">reverso<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
        <label class="voice hide" id="vWrap">voz <select id="vSel" aria-label="Voz em francês"></select></label>
      </div>
      <div class="ans">
        <button class="btn" id="bNo">Errei</button>
        <button class="btn yes" id="bYes">Acertei</button>
      </div>
      <p class="hint">As que você errar voltam no fim da rodada.</p>
    </div>
    <div class="done hide" id="done">
      <h2 id="dT"></h2>
      <p id="dP"></p>
      <div class="acts">
        <button class="btn pri" id="bAgain">Repetir capítulo</button>
        <button class="btn" id="bHome">Ver capítulos</button>
      </div>
    </div>
  </section>
</main>

<script>
// kinds: t = traduza (FR→PT), p = diga em francês (PT→FR), c = complete, r = regra
const CH = [
{t:"Le verbe « être »",s:"Ser/estar, pronomes sujeitos, à/de/chez",c:[
["c","Je ___ brésilienne.","Je suis brésilienne.","être: je suis"],
["c","Tu ___ fatigué ?","Tu es fatigué ?","tu es — mesmo som que est"],
["c","Elle ___ à Lyon.","Elle est à Lyon.","il/elle/on est"],
["c","Nous ___ en vacances.","Nous sommes en vacances.","nous sommes (com s)"],
["c","Vous ___ d'où ?","Vous êtes d'où ?","vous êtes — liaison: vou-zète"],
["c","Mes amis ___ italiens.","Mes amis sont italiens.","ils/elles sont"],
["p","Eu sou de Curitiba.","Je suis de Curitiba.","origem: de + cidade"],
["p","Estou em Lisboa.","Je suis à Lisbonne.","cidade → à"],
["p","Estou na casa da Ana.","Je suis chez Ana.","pessoa → chez"],
["p","Ela é de Orléans.","Elle est d'Orléans.","de + vogal → d'"],
["r","Tu ou vous para falar com um desconhecido?","Vous","vous = formal (1 pessoa) ou plural; tu = íntimo"],
["r","On est = ?","A gente está / a gente é","on conjuga como il, mas significa “nós” informal"],
["t","Vous êtes prêts, les enfants ?","Vocês estão prontos, crianças?","plural → vous"]]},

{t:"L'adjectif (1)",s:"Masculino/feminino, singular/plural",c:[
["p","Ele é alto. / Ela é alta.","Il est grand. / Elle est grande.","feminino: + e (o d passa a soar)"],
["p","Ele é suíço. / Ela é suíça.","Il est suisse. / Elle est suisse.","terminado em -e: não muda"],
["c","Elle est (italien) ___.","Elle est italienne.","-ien → -ienne"],
["c","Elle est (sportif) ___.","Elle est sportive.","-f → -ve"],
["c","Elle est (heureux) ___.","Elle est heureuse.","-eux → -euse"],
["c","Elle est (cher) ___.","Elle est chère.","-er → -ère"],
["c","Elle est (beau) ___.","Elle est belle.","irregulares: beau/belle, nouveau/nouvelle, vieux/vieille"],
["c","Ils sont (normal) ___.","Ils sont normaux.","-al → -aux"],
["c","Elles sont (blond) ___.","Elles sont blondes.","feminino plural: + es"],
["r","Marie et Paul sont ___ (content).","contents","grupo misto → masculino plural"],
["r","Nacionalidade como adjetivo: maiúscula ou minúscula?","Minúscula: il est français","Maiúscula só para o substantivo: un Français"],
["t","Vous êtes prête, madame ?","A senhora está pronta?","vous formal singular → adjetivo no singular"]]},

{t:"La négation et l'interrogation (1)",s:"ne…pas, est-ce que, oui/si",c:[
["p","Não sou francesa.","Je ne suis pas française.","ne + verbo + pas"],
["p","Ele não está aqui.","Il n'est pas là.","ne + vogal → n'"],
["r","3 jeitos de perguntar “Você está cansado?”","Tu es fatigué ? / Est-ce que tu es fatigué ? / Es-tu fatigué ?","entonação (fala), est-ce que (neutro), inversão (formal)"],
["c","___ vous êtes libre ?","Est-ce que vous êtes libre ?","est-ce que + frase normal"],
["r","Responder SIM a uma pergunta negativa: “Tu n'es pas content ?”","Si !","si = sim, contradizendo uma negativa"],
["p","Eu também (afirmativo).","Moi aussi.","aussi = também"],
["p","Eu também não.","Moi non plus.","non plus = também não"],
["t","Vous n'êtes pas de Paris ? — Si, je suis de Paris.","Você não é de Paris? — Sou sim.",""],
["t","Est-il marié ?","Ele é casado?","inversão: verbo-sujeito com hífen"]]},

{t:"Le nom et l'article",s:"Gênero, plural, artigos, contrações",c:[
["r","Artigos definidos","le, la, l', les","o, a, os, as"],
["r","Artigos indefinidos","un, une, des","um, uma, uns/umas"],
["p","a escola","l'école","le/la + vogal → l'"],
["c","à + le cinéma =","au cinéma","à + le → au"],
["c","à + les États-Unis =","aux États-Unis","à + les → aux"],
["c","de + le boulanger =","du boulanger","de + le → du"],
["c","de + les voisins =","des voisins","de + les → des"],
["r","à la / à l' / de la / de l' contraem?","Não","só le e les contraem"],
["r","un journal → plural?","des journaux","-al → -aux"],
["r","un gâteau → plural?","des gâteaux","-eau → -eaux"],
["r","le problème: masculino ou feminino?","Masculino","-ème é geralmente masculino"],
["r","la nation: gênero de -tion?","Feminino","-tion, -sion, -té → geralmente femininos"]]},

{t:"« C'est » et « il est »",s:"Identificar vs. descrever",c:[
["r","C'est ou il est + nome com artigo?","C'est","c'est un ami / c'est mon frère"],
["r","C'est ou il est + adjetivo (pessoa)?","Il est","il est gentil"],
["p","É o Paul. Ele é simpático.","C'est Paul. Il est sympathique.",""],
["p","Ela é médica.","Elle est médecin.","profissão sem artigo depois de il/elle est"],
["p","É uma médica excelente.","C'est un médecin excellent.","com adjetivo → c'est un(e)"],
["p","São meus pais.","Ce sont mes parents.","plural: ce sont"],
["t","C'est beau !","Que lindo! / É bonito!","c'est + adjetivo = comentário geral"],
["r","Il est 8 heures. Qual é o il?","Il impessoal","hora usa sempre il est"]]},

{t:"Les possessifs",s:"mon/ma/mes, le mien…",c:[
["r","meu / minha / meus","mon / ma / mes",""],
["r","teu / tua / teus","ton / ta / tes",""],
["r","seu/sua (dele/dela) / seus","son / sa / ses","concorda com a COISA, não com o dono"],
["r","nosso(a) / nossos","notre / nos",""],
["r","seu(sua) de vocês / seus","votre / vos",""],
["r","deles / delas (1 coisa / várias)","leur / leurs",""],
["p","minha amiga","mon amie","ma + vogal → mon"],
["p","a mala dele","sa valise","valise é feminino → sa, mesmo sendo dele"],
["p","É o meu (livro).","C'est le mien.","le mien, la mienne, les miens, les miennes"],
["p","É a sua (tu) bolsa? É a tua.","C'est la tienne.",""],
["t","Ce sont les nôtres.","São os nossos.","le nôtre / la nôtre / les nôtres"]]},

{t:"Les noms de parenté et de groupe",s:"Família e coletivos",c:[
["t","les parents","os pais (ou parentes)",""],
["t","les grands-parents","os avós",""],
["t","le fils / la fille","o filho / a filha","fils: pronuncia “fiss”"],
["t","les enfants","os filhos / as crianças",""],
["t","le neveu / la nièce","o sobrinho / a sobrinha",""],
["t","le beau-père / la belle-mère","o sogro (ou padrasto) / a sogra (ou madrasta)",""],
["t","le cousin / la cousine","o primo / a prima",""],
["p","marido / esposa","le mari / la femme","femme = mulher e esposa"],
["t","Toute la famille est là.","A família toda está aqui.","coletivo no singular → verbo no singular"],
["t","Les gens sont sympas.","As pessoas são simpáticas.","les gens é plural"]]},

{t:"Les démonstratifs",s:"ce/cet/cette/ces, celui-ci",c:[
["r","este/esse (masc.)","ce","ce livre"],
["r","este/esse (masc. + vogal/h mudo)","cet","cet ami, cet hôtel"],
["r","esta/essa","cette","cette robe"],
["r","estes/estas","ces","ces chaussures"],
["p","Quero este bolo.","Je voudrais ce gâteau.",""],
["p","este homem","cet homme","h mudo → cet"],
["p","Este aqui (masc.) / Esta aqui (fem.)","celui-ci / celle-ci","pronomes: evitam repetir o nome"],
["p","Estes aqui / Estas aqui","ceux-ci / celles-ci",""],
["t","Je préfère celui-là.","Prefiro aquele.","-ci = perto, -là = longe"],
["t","Ça, c'est intéressant.","Isso é interessante.","ça = isso (informal de cela)"]]},

{t:"« Il y a » et « c'est »",s:"Existir vs. identificar",c:[
["p","Tem um gato no jardim.","Il y a un chat dans le jardin.","il y a = há / tem (existência)"],
["p","Não tem pão.","Il n'y a pas de pain.","negativa: pas de"],
["p","É um siamês.","C'est un siamois.","c'est identifica o que foi apresentado"],
["p","Tem quê?","Qu'est-ce qu'il y a ?","também: “O que houve?”"],
["t","Il y a beaucoup de monde.","Tem muita gente.",""],
["t","Dans ma rue, il y a une boulangerie. C'est la meilleure du quartier.","Na minha rua tem uma padaria. É a melhor do bairro.","il y a apresenta, c'est comenta"],
["r","il y a + tempo passado (il y a deux ans)","há dois anos (atrás)","também marca tempo decorrido"]]},

{t:"La situation dans l'espace (1)",s:"Cidades, países, preposições de lugar",c:[
["r","Cidade","à Paris","à + cidade"],
["r","País feminino (termina em -e)","en France, en Italie",""],

</script>
<script>
{
const KIND={t:"traduza.fr",p:"diga-em-francês.pt",c:"complete.fr",r:"regra.md"};
const $=id=>document.getElementById(id);
const KEY="fiches-fr-v1";
let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=[];CH.forEach((ch,ci)=>ch.c.forEach((c,i)=>all.push({ci,i,id:ci+"-"+i,k:c[0],f:c[1],b:c[2],n:c[3]||""})));
const canSpeak=(()=>{try{return "speechSynthesis" in window}catch(e){return false}})();

function renderHome(){
  let tot=0,ok=0;
  $("list").innerHTML=CH.map((ch,ci)=>{
    const n=ch.c.length,k=ch.c.filter((_,i)=>st[ci+"-"+i]===1).length;tot+=n;ok+=k;
    return `<li><button class="ch${k===n?" full":""}" data-c="${ci}"><span class="n">${ci+1}</span><span><b>${esc(ch.t)}</b><small>${esc(ch.s)}</small><span class="pc"><span class="mini"><i style="width:${Math.round(k/n*100)}%"></i></span>${k}/${n}</span></span></button></li>`}).join("");
  $("gbar").style.width=(ok/tot*100)+"%";
  $("sub").textContent=`${CH.length} capítulos do Grammaire Progressive (débutant). ${ok} de ${tot} fichas dominadas.`;
  $("bWrong").disabled=!all.some(c=>st[c.id]===0);
}

let q=[],cur=null,title="",chap=null,total=0,okRun=0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function start(cards,t,ci,mix){
  q=mix?shuffle(cards.slice()):cards.slice();total=q.length;okRun=0;title=t;chap=ci;
  $("home").classList.add("hide");$("hero").classList.add("hide");$("study").classList.remove("hide");
  $("deck").classList.remove("hide");$("done").classList.add("hide");
  $("sTitle").textContent=t;$("bAgain").textContent=ci==null?"Repetir rodada":"Repetir capítulo";
  window.scrollTo(0,0);next();
}
function next(){
  if(!q.length){finish();return}
  cur=q[0];const card=$("card");card.classList.remove("flip");
  const sp="";$("aRev").href=revLink(frText(cur));
  $("kF").textContent=KIND[cur.k];$("kB").textContent=KIND[cur.k];
  $("tF").innerHTML=esc(cur.f)+(cur.k==="t"?sp:"");
  $("qB").textContent=cur.f;
  $("tB").innerHTML=esc(cur.b)+(cur.k!=="t"?sp:"");
  $("nB").textContent=cur.n;
  $("sCount").textContent=`${total-q.length+1} de ${total}`+(chap==null&&cur?` · cap. ${cur.ci+1}`:"");
  $("sProg").style.width=((total-q.length)/total*100)+"%";
}
function flip(){$("card").classList.toggle("flip")}
function answer(ok){
  if(!cur)return;
  st[cur.id]=ok?1:0;save();
  q.shift();
  if(ok)okRun++;else{q.push(cur);total++}
  next();
}
function finish(){
  $("deck").classList.add("hide");$("done").classList.remove("hide");$("sProg").style.width="100%";
  const miss=total-okRun;
  $("dT").textContent=miss?"Rodada concluída!":"Parfait !";
  $("dP").textContent=miss?`Você acertou todos no fim, mas errou ${miss} vez${miss>1?"es":""} pelo caminho. Elas ficam marcadas em “Revisar as que errei”.`:`Acertou todos os ${okRun} de primeira. Bravo !`;
  $("sCount").textContent="";cur=null;
}
const frText=c=>(c.k==="t"?c.f:c.b).split(" / ")[0].replace(/___/g,"").replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
function revLink(t){const w=t.replace(/[?!.,;:«»—…]/g," ").replace(/\s+/g," ").trim();
  return w.split(" ").length<=2?"https://dicionario.reverso.net/frances-portugues/"+encodeURIComponent(w.toLowerCase())
  :"https://context.reverso.net/traducao/frances-portugues/"+encodeURIComponent(w)}
const VK="fiches-fr-voice";let voices=[],chosen=null;
try{chosen=localStorage.getItem(VK)}catch(e){}
const score=v=>(/natural|online|neural/i.test(v.name)?40:0)+(/premium|enhanced|amélie|amelie|thomas|google/i.test(v.name)?20:0)+(/fr-FR/i.test(v.lang)?5:0)+(v.localService?0:3);
function loadVoices(){
  if(!canSpeak)return;
  try{voices=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)).sort((a,b)=>score(b)-score(a))}catch(e){voices=[]}
  if(!voices.length)return;
  $("vSel").innerHTML=voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/^Microsoft /,"").replace(/ - French.*$/,""))} (${esc(v.lang)})</option>`).join("");
  if(chosen&&voices.some(v=>v.name===chosen))$("vSel").value=chosen;
  $("vWrap").classList.remove("hide");
}
function speak(){
  if(!cur||!canSpeak)return;
  try{const u=new SpeechSynthesisUtterance(frText(cur));u.lang="fr-FR";u.rate=.9;
  const v=voices.find(v=>v.name===$("vSel").value)||voices[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function goHome(){$("study").classList.add("hide");$("home").classList.remove("hide");$("hero").classList.remove("hide");cur=null;renderHome();try{history.replaceState(null,"","#inicio")}catch(e){}}

$("list").addEventListener("click",e=>{const b=e.target.closest(".ch");if(!b)return;const ci=+b.dataset.c;
  openChap(ci);try{history.replaceState(null,"","#cap"+(ci+1))}catch(err){}});
function openChap(ci){start(all.filter(c=>c.ci===ci),`${ci+1}. ${CH[ci].t}`,ci,false)}
$("card").addEventListener("click",flip);
$("bSpeak").onclick=speak;if(!canSpeak)$("bSpeak").classList.add("hide");
$("vSel").onchange=()=>{chosen=$("vSel").value;try{localStorage.setItem(VK,chosen)}catch(e){}speak()};
$("bYes").onclick=()=>answer(true);$("bNo").onclick=()=>answer(false);
$("bShuf").onclick=()=>{if(q.length>1){shuffle(q);next()}};
$("bBack").onclick=goHome;$("bHome").onclick=goHome;
$("bAgain").onclick=()=>{chap==null?start(all.filter(c=>st[c.id]===0).length?all.filter(c=>st[c.id]===0):all,title,null,true):openChap(chap)};
$("bMix").onclick=()=>start(shuffle(all.slice()).slice(0,25),"Mistura de todos os capítulos",null,true);
$("bWrong").onclick=()=>{const w=all.filter(c=>st[c.id]===0);if(w.length)start(w,"Revisar as que errei",null,true)};
let armed=false;
$("bReset").onclick=()=>{if(!armed){armed=true;$("bReset").textContent="Toque de novo para confirmar";setTimeout(()=>{armed=false;$("bReset").textContent="Zerar progresso"},3000);return}
  st={};save();armed=false;$("bReset").textContent="Zerar progresso";renderHome()};
document.addEventListener("keydown",e=>{if($("study").classList.contains("hide")||!cur)return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}else if(e.key==="ArrowRight")answer(true);else if(e.key==="ArrowLeft")answer(false)});
let sx=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>70&&$("card").classList.contains("flip")){e.preventDefault();answer(dx>0)}});
function route(){const m=/^#cap(\d+)$/.exec(location.hash);if(m&&CH[m[1]-1])openChap(m[1]-1);else if(!$("study").classList.contains("hide"))goHome()}
window.addEventListener("hashchange",route);
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
renderHome();route();
}
</script>
